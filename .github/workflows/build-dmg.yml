# Builds the Parallax macOS app from the PRIVATE source repo and publishes it here.
#
# Why here: the source repo is private, and a private repo's release files cannot be downloaded without a token, so
# installed apps update from this public repo (latest.json). Building here also keeps GitHub's free macOS minutes.
# The source is checked out with a read-only deploy key (secret SOURCE_DEPLOY_KEY); the updater signing key is the
# secret TAURI_SIGNING_PRIVATE_KEY. Only an owner of this repo can run it (workflow_dispatch). Compiler warnings are
# silenced so the public log carries no source lines.
name: Build macOS DMG

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 1.1.61"
        required: true
      ref:
        description: "Source branch or commit"
        required: false
        default: "main"

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ZaphodBeblerbox/Horizon-Watch
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund --loglevel=error

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Stamp the version into the bundle
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python3 - "$VERSION" <<'PY'
          import json, sys, pathlib
          p = pathlib.Path("src-tauri/tauri.conf.json")
          c = json.loads(p.read_text()); c["version"] = sys.argv[1]
          p.write_text(json.dumps(c, indent=2) + "\n")
          PY

      - name: Build the app and the DMG
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          RUSTFLAGS: -Awarnings
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npx tauri build --bundles app,dmg > build.log 2>&1 || { tail -40 build.log | grep -vE "^\s*[0-9]+ \|" ; exit 1; }

      - name: Publish the release (installers and the update)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          B=src-tauri/target/release/bundle
          TGZ="$B/macos/Parallax.app.tar.gz"
          test -f "$TGZ" && test -f "$TGZ.sig" || { echo "no signed update bundle"; exit 1; }
          DMG=$(find src-tauri/target -name "*.dmg" -print -quit)
          test -n "$DMG" || { echo "no dmg"; exit 1; }
          mkdir -p out && cp "$TGZ" "$TGZ.sig" "$DMG" out/ && cp "$DMG" out/Parallax.dmg
          python3 - "$VERSION" "$TGZ.sig" <<'PY'
          import json, sys, datetime
          v, sig = sys.argv[1], open(sys.argv[2]).read().strip()
          j = {"version": v, "notes": f"Parallax {v}",
               "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
               "platforms": {"darwin-aarch64": {"signature": sig,
                   "url": f"https://github.com/ZaphodBeblerbox/parallax-releases/releases/download/v{v}/Parallax.app.tar.gz"}}}
          open("out/latest.json", "w").write(json.dumps(j, indent=2))
          PY
          TAG="v$VERSION"
          REPO="${{ github.repository }}"
          gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 || gh release create "$TAG" --repo "$REPO" --latest \
            --title "Parallax $VERSION" --notes "Download Parallax.dmg, open it, drag Parallax to Applications, then run once in Terminal: xattr -cr /Applications/Parallax.app"
          gh release upload "$TAG" out/* --repo "$REPO" --clobber
